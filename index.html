<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>MyBusiness · Finanze personali e familiari</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">M</div><div><b>my-business</b><small>PERSONAL FINANCE</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard">◫ <span>Panoramica</span></button>
        <button class="nav-item" data-page="business">▤ <span>Partita IVA</span></button>
        <button class="nav-item" data-page="transactions">↕ <span>Movimenti</span></button>
        <button class="nav-item" data-page="family">⌂ <span>Famiglia</span></button>
        <button class="nav-item" data-page="deadlines">◷ <span>Scadenze</span></button>
        <button class="nav-item" data-page="settings">⚙ <span>Impostazioni</span></button>
      </nav>
      <div class="sidebar-foot"><span class="dot"></span> Dati salvati su questo dispositivo</div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow">AREA PERSONALE</div><h1 id="page-title">Panoramica</h1></div><div class="top-actions"><span class="today" id="today"></span><button class="btn btn-primary" id="quick-add">＋ Nuovo movimento</button></div></header>
      <section id="app"></section>
      <footer>MyBusiness · Versione locale · I dati restano nel browser di questo dispositivo</footer>
    </main>
  </div>
  <dialog id="movement-dialog">
    <form method="dialog" id="movement-form">
      <div class="dialog-head"><h2>Nuovo movimento</h2><button class="icon-btn" value="cancel" aria-label="Chiudi">✕</button></div>
      <label>Descrizione<input name="description" required placeholder="Es. Incasso PS Company"></label>
      <div class="form-grid">
        <label>Importo (€)<input name="amount" type="number" step="0.01" min="0.01" required></label>
        <label>Data<input name="date" type="date" required></label>
        <label>Tipo<select name="type"><option value="income">Entrata</option><option value="expense">Uscita</option></select></label>
        <label>Area<select name="area"><option value="business">Partita IVA</option><option value="personal">Personale</option><option value="family">Famiglia</option><option value="tax">Fisco & INPS</option></select></label>
      </div>
      <label>Note<input name="note" placeholder="Facoltative"></label>
      <div class="dialog-actions"><button class="btn" value="cancel">Annulla</button><button class="btn btn-primary" id="save-movement" value="default">Salva movimento</button></div>
    </form>
  </dialog>
  <script src="src/app.js"></script>
</body>
</html>
